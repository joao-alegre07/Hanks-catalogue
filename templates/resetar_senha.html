{% extends "base.html" %}
{% block body %}
<main class="auth-page">
  <form class="auth-form" method="post">
    <h1>Nova senha</h1>
    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
    <input type="hidden" name="token" value="{{ token }}">
    <label>Nova senha<input type="password" name="nova_senha" required minlength="6" autofocus></label>
    <button type="submit">Trocar senha</button>
    <p><a href="{{ url_for('auth.login') }}">Voltar pro login</a></p>
  </form>
</main>
{% endblock %}
