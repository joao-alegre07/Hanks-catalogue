name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGEM_BASE: ghcr.io/joao-alegre07/hanks-catalogue

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: instala dependências
        run: |
          pip install -r requirements.txt -r auth-service/requirements.txt \
            -r log-service/requirements.txt -r requirements-dev.txt

      - name: testes do catálogo
        run: python -m pytest -v tests

      - name: testes do auth-service
        working-directory: auth-service
        run: python -m pytest -v

      - name: testes do log-service
        working-directory: log-service
        run: python -m pytest -v

  imagens:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - servico: app
            contexto: .
          - servico: auth
            contexto: ./auth-service
          - servico: log
            contexto: ./log-service
          - servico: garage
            contexto: ./garage
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: login no ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<7 primeiros caracteres do commit> sempre; latest só na main.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEM_BASE }}-${{ matrix.servico }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Em pull request só builda (pra ver se o Dockerfile não quebrou), sem publicar.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}

  deploy:
    needs: imagens
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Troca a variável IMAGE_TAG da stack pela tag desse commit e manda o
      # Portainer puxar o repositório e as imagens de novo. As outras variáveis
      # da stack (senhas, chaves) vêm do próprio Portainer e voltam pra ele do
      # jeito que estavam -- nada disso passa pelo log.
      #
      # Hoje o Cloudflare na frente do portainer.lapps.studio responde 403 pros
      # runners do GitHub (de um computador comum a mesma chamada dá 200). Nesse
      # caso o job não falha: avisa e deixa no resumo da execução a tag pra
      # aplicar no Portainer com um clique.
      - name: atualiza a stack no portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          tag="sha-${GITHUB_SHA::7}"

          deploy_manual() {
            echo "::warning::$1 -- deploy manual: IMAGE_TAG=$tag no Portainer e Pull and redeploy"
            {
              echo "### Imagens publicadas com a tag \`$tag\`"
              echo
              echo "$1. Pra colocar em produção: Portainer → stack hanks-catalogue →"
              echo "Environment variables → \`IMAGE_TAG\` = \`$tag\` → **Pull and redeploy**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ -z "$PORTAINER_URL" ] || [ -z "$PORTAINER_TOKEN" ] || [ -z "$PORTAINER_STACK_ID" ]; then
            deploy_manual "Secrets do Portainer não configurados"
          fi

          api="${PORTAINER_URL%/}/api"

          codigo=$(curl -sS -o stack.json -w '%{http_code}' \
            -H "X-API-Key: $PORTAINER_TOKEN" "$api/stacks/$PORTAINER_STACK_ID")
          if [ "$codigo" != 200 ]; then
            rm -f stack.json
            deploy_manual "Portainer respondeu $codigo ao ler a stack"
          fi

          jq --arg tag "$tag" '{
              env: ([.Env[] | select(.name != "IMAGE_TAG")] + [{name: "IMAGE_TAG", value: $tag}]),
              prune: false,
              pullImage: true,
              repositoryReferenceName: .GitConfig.ReferenceName,
              repositoryAuthentication: false
            }' stack.json > corpo.json
          endpoint=$(jq -r '.EndpointId' stack.json)
          rm stack.json

          # Daqui pra frente a leitura funcionou, então um erro no redeploy é
          # erro de verdade e derruba o job.
          curl -fsS -o /dev/null -X PUT \
            -H "X-API-Key: $PORTAINER_TOKEN" -H "Content-Type: application/json" \
            --data @corpo.json \
            "$api/stacks/$PORTAINER_STACK_ID/git/redeploy?endpointId=$endpoint"
          rm corpo.json

          echo "### Stack atualizada pra \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
