openapi: 3.0.3
info:
  title: Tom Hanks Catalog
  version: "1.0"
  description: |
    Rotas públicas do catálogo. É uma aplicação web tradicional: as rotas devolvem páginas HTML
    e os formulários são enviados como `application/x-www-form-urlencoded` (ou `multipart/form-data`
    no upload da foto). Depois de uma ação que dá certo, a resposta é um redirecionamento `302`.

    **Pra usar o "Try it out":** faça login no site nesse mesmo navegador (ou pelo próprio
    `POST /login` aqui embaixo). A sessão fica no cookie `session`, que o navegador já manda junto.
    Sem login, as rotas protegidas redirecionam pra `/login` — como o navegador segue o
    redirecionamento sozinho, o Swagger mostra o HTML da página de login.

    O auth-service e o log-service têm documentação própria, em `/apidocs` de cada um
    (só acessível rodando localmente, já que eles não têm porta pública).

tags:
  - name: contas
    description: Cadastro, login e recuperação de senha (repassados pro auth-service)
  - name: catálogo
    description: Filmes, favoritos e comentários
  - name: perfil
    description: Página de perfil e foto
  - name: premium
    description: Assinatura do plano premium (Stripe, em modo de teste)
  - name: admin
    description: Só pra quem tem papel admin
  - name: saúde
    description: Health checks e métricas, sem login

components:
  securitySchemes:
    sessao:
      type: apiKey
      in: cookie
      name: session
      description: Cookie de sessão criado no login.
  responses:
    Html:
      description: Página HTML.
      content:
        text/html:
          schema:
            type: string
    RedirLogin:
      description: Sem login. Redireciona pra `/login`.
      headers:
        Location:
          schema:
            type: string
            example: /login
    CampoFaltando:
      description: Faltou um campo obrigatório do formulário.
    Proibido:
      description: Sem permissão. A tentativa é registrada no log como `acesso_negado`.
    NaoEncontrado:
      description: Não existe.

paths:
  /cadastro:
    get:
      tags: [contas]
      summary: Formulário de cadastro
      responses:
        "200":
          $ref: "#/components/responses/Html"
    post:
      tags: [contas]
      summary: Cria uma conta
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome:
                  type: string
                  example: Maria
                email:
                  type: string
                  example: maria@exemplo.com
                senha:
                  type: string
                  format: password
      responses:
        "302":
          description: Conta criada. Redireciona pra `/login`.
          headers:
            Location:
              schema:
                type: string
                example: /login
        "200":
          description: >
            Não cadastrou (campo vazio, e-mail já usado ou auth-service fora do ar).
            Volta o formulário com a mensagem de erro.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/CampoFaltando"

  /login:
    get:
      tags: [contas]
      summary: Formulário de login
      responses:
        "200":
          $ref: "#/components/responses/Html"
    post:
      tags: [contas]
      summary: Faz login
      description: Confere a senha no auth-service e, se estiver certa, cria o cookie de sessão.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  example: maria@exemplo.com
                senha:
                  type: string
                  format: password
      responses:
        "302":
          description: Login certo. Cria o cookie `session` e redireciona pro catálogo.
          headers:
            Location:
              schema:
                type: string
                example: /
            Set-Cookie:
              schema:
                type: string
                example: session=eyJub21lIjoi...; HttpOnly; Path=/
        "200":
          description: E-mail ou senha errados. Volta o formulário com a mensagem de erro.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/CampoFaltando"

  /logout:
    get:
      tags: [contas]
      summary: Sai da conta
      responses:
        "302":
          description: Apaga a sessão e redireciona pra `/login`.

  /esqueci-senha:
    get:
      tags: [contas]
      summary: Formulário de esqueci a senha
      responses:
        "200":
          $ref: "#/components/responses/Html"
    post:
      tags: [contas]
      summary: Pede o link de redefinição por e-mail
      description: >
        A resposta é sempre a mesma, com ou sem conta cadastrada nesse e-mail, pra não dar pra
        descobrir quem tem conta.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: maria@exemplo.com
      responses:
        "200":
          description: Página com a mensagem "Se esse e-mail estiver cadastrado, você vai receber um link".
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/CampoFaltando"

  /resetar-senha:
    get:
      tags: [contas]
      summary: Formulário de nova senha (link do e-mail)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Html"
    post:
      tags: [contas]
      summary: Troca a senha
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, nova_senha]
              properties:
                token:
                  type: string
                nova_senha:
                  type: string
                  format: password
      responses:
        "302":
          description: Senha trocada. Redireciona pra `/login?redefinida=1`.
        "200":
          description: Token inválido, já usado ou expirado. Volta o formulário com a mensagem de erro.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/CampoFaltando"

  /:
    get:
      tags: [catálogo]
      summary: Catálogo paginado
      description: 20 filmes por página, buscados na hora na API do TMDB.
      security:
        - sessao: []
      parameters:
        - name: page
          in: query
          description: Número da página. Fora do intervalo, é ajustado pra primeira ou última.
          schema:
            type: integer
            default: 1
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          $ref: "#/components/responses/RedirLogin"

  /favoritar:
    post:
      tags: [catálogo]
      summary: Favorita ou desfavorita um filme
      description: >
        Se o filme já está nos favoritos, sai; se não está, entra. No plano gratuito cada usuário
        tem até 5 favoritos; pra favoritar o sexto, o catálogo pergunta o plano atual pro
        auth-service e só premium passa. Desfavoritar é sempre liberado.
      security:
        - sessao: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [tmdb_movie_id, titulo]
              properties:
                tmdb_movie_id:
                  type: integer
                  example: 13
                titulo:
                  type: string
                  example: Forrest Gump
                poster_path:
                  type: string
                  example: /arw2vcBveWOVZr6pxd9XTd1TdQa.jpg
                page:
                  type: integer
                  description: Página do catálogo pra onde voltar.
                  example: 1
      responses:
        "302":
          description: Feito. Volta pro catálogo na mesma página (ou pra `/login`, sem sessão).
        "400":
          $ref: "#/components/responses/CampoFaltando"
        "403":
          description: Limite de favoritos do plano gratuito. Fica no log como `acesso_negado`.

  /comentar:
    post:
      tags: [catálogo]
      summary: Comenta num filme
      description: Comentário vazio é ignorado.
      security:
        - sessao: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [tmdb_movie_id, texto]
              properties:
                tmdb_movie_id:
                  type: integer
                  example: 13
                texto:
                  type: string
                  example: Um dos melhores dele.
                page:
                  type: integer
                  example: 1
      responses:
        "302":
          description: Feito. Volta pro catálogo na mesma página (ou pra `/login`, sem sessão).
        "400":
          $ref: "#/components/responses/CampoFaltando"

  /comentarios/{comentario_id}/deletar:
    post:
      tags: [catálogo]
      summary: Apaga um comentário
      description: >
        O autor pode apagar o próprio comentário. Pra apagar o de outra pessoa, o catálogo pergunta
        o papel atual do usuário pro auth-service, e só admin passa.
      security:
        - sessao: []
      parameters:
        - name: comentario_id
          in: path
          required: true
          schema:
            type: integer
            example: 42
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
      responses:
        "302":
          description: Apagado. Volta pro catálogo (ou pra `/login`, sem sessão).
        "403":
          $ref: "#/components/responses/Proibido"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /premium:
    get:
      tags: [premium]
      summary: Página do plano premium
      description: Mostra o plano atual (perguntado na hora pro auth-service) e o botão de assinar.
      security:
        - sessao: []
      parameters:
        - name: sucesso
          in: query
          description: Volta do checkout pago. Só mostra um aviso; quem ativa o plano é o webhook.
          schema:
            type: integer
            example: 1
        - name: cancelado
          in: query
          description: Volta do checkout sem pagar.
          schema:
            type: integer
            example: 1
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          $ref: "#/components/responses/RedirLogin"

  /premium/assinar:
    post:
      tags: [premium]
      summary: Abre o checkout do Stripe
      description: >
        Cria uma Checkout Session (modo assinatura, preço `STRIPE_PRICE_ID`) com o id do usuário em
        `client_reference_id` e redireciona pra página de pagamento do Stripe. O cartão é digitado
        lá, nunca no catálogo. Quem já é premium volta pra `/premium`.
      security:
        - sessao: []
      responses:
        "303":
          description: Redireciona pro checkout do Stripe.
          headers:
            Location:
              schema:
                type: string
                example: https://checkout.stripe.com/c/pay/cs_test_a1b2c3...
        "302":
          $ref: "#/components/responses/RedirLogin"
        "503":
          description: Stripe ou auth-service não responderam.

  /stripe/webhook:
    post:
      tags: [premium]
      summary: Webhook do Stripe
      description: >
        Chamado pelo Stripe, não pelo navegador. Confere o cabeçalho `Stripe-Signature` com o
        segredo do endpoint (`STRIPE_WEBHOOK_SECRET`) antes de ler qualquer coisa do corpo.
        `checkout.session.completed` pago liga o premium do usuário; `customer.subscription.deleted`
        desliga. Outros eventos recebem `200` e são ignorados.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
            example: t=1791580000,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              id: evt_1Q8xYz2eZvKYlo2C
              type: checkout.session.completed
              data:
                object:
                  id: cs_test_a1b2c3
                  client_reference_id: "7"
                  payment_status: paid
                  customer: cus_R2x9aB3cD4eF5g
                  subscription: sub_1Q8xYz2eZvKYlo2C
      responses:
        "200":
          description: Evento recebido.
          content:
            application/json:
              example: {"recebido": true}
        "400":
          description: Sem assinatura ou assinatura que não bate. Fica no log como `webhook_recusado`.
          content:
            application/json:
              example: {"erro": "Assinatura inválida."}
        "503":
          description: O auth-service não gravou o plano. O Stripe tenta de novo mais tarde.

  /admin/logs:
    get:
      tags: [admin]
      summary: Log de auditoria
      description: >
        Últimos eventos do log-service, do mais recente pro mais antigo. Se o log-service estiver
        fora do ar, a página abre com um aviso em vez da lista.
      security:
        - sessao: []
      parameters:
        - name: "n"
          in: query
          description: Quantos eventos mostrar (de 1 a 500).
          schema:
            type: integer
            default: 50
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          $ref: "#/components/responses/RedirLogin"
        "403":
          $ref: "#/components/responses/Proibido"

  /perfil:
    get:
      tags: [perfil]
      summary: Meu perfil
      security:
        - sessao: []
      responses:
        "302":
          description: Redireciona pra `/perfil/<seu id>` (ou pra `/login`, sem sessão).

  /perfil/{usuario_id}:
    get:
      tags: [perfil]
      summary: Perfil de um usuário
      description: Nome, foto, bio e filmes favoritados. Qualquer usuário logado vê qualquer perfil.
      security:
        - sessao: []
      parameters:
        - name: usuario_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          $ref: "#/components/responses/RedirLogin"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "503":
          description: auth-service fora do ar.

  /perfil/{usuario_id}/editar:
    post:
      tags: [perfil]
      summary: Edita bio e foto do próprio perfil
      description: >
        O id da URL precisa ser o mesmo da sessão — nem admin edita o perfil de outra pessoa.
        A foto é conferida pelos primeiros bytes do arquivo, não pela extensão.
      security:
        - sessao: []
      parameters:
        - name: usuario_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                bio:
                  type: string
                  maxLength: 280
                  example: Fã de Náufrago.
                foto:
                  type: string
                  format: binary
                  description: JPG, PNG ou WebP de até 2 MB. Opcional; sem foto, mantém a atual.
      responses:
        "302":
          description: Salvo. Redireciona pro perfil (ou pra `/login`, sem sessão).
        "400":
          description: Bio com mais de 280 caracteres, foto acima de 2 MB ou arquivo que não é JPG/PNG/WebP.
          content:
            text/html:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Proibido"
        "413":
          description: Requisição inteira acima de 5 MB.
        "503":
          description: Não conseguiu salvar a foto no object storage.

  /fotos/{caminho}:
    get:
      tags: [perfil]
      summary: Foto de perfil (URL pré-assinada)
      description: >
        Repassa a URL assinada pro Garage. Essa URL é gerada na página de perfil e vale 10 minutos;
        a query string traz a assinatura (`X-Amz-Algorithm`, `X-Amz-Credential`, `X-Amz-Date`,
        `X-Amz-Expires`, `X-Amz-SignedHeaders`, `X-Amz-Signature`).
      parameters:
        - name: caminho
          in: path
          required: true
          schema:
            type: string
            example: fotos-perfil/perfis/1/3f2a9c1e.png
      responses:
        "200":
          description: A imagem.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "403":
          description: Assinatura inválida ou vencida.
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "503":
          description: Object storage fora do ar.

  /health:
    get:
      tags: [saúde]
      summary: "Readiness: o catálogo consegue falar com o MariaDB e com o Garage"
      description: >
        É pra cá que aponta o HEALTHCHECK do Docker. Faz um `SELECT 1` no MariaDB e um `HeadBucket`
        no Garage, cada um com timeout de 2 segundos. O auth e o log não entram aqui: cada um tem o
        próprio `/health`.
      responses:
        "200":
          description: Tudo certo.
          content:
            application/json:
              example: {"status": "ok", "dependencias": {"mariadb": "ok", "garage": "ok"}}
        "503":
          description: Alguma dependência fora do ar.
          content:
            application/json:
              example: {"status": "falhou", "dependencias": {"mariadb": "ok", "garage": "falhou: EndpointConnectionError"}}

  /health/live:
    get:
      tags: [saúde]
      summary: "Liveness: o processo está de pé e respondendo"
      responses:
        "200":
          description: Vivo.
          content:
            application/json:
              example: {"status": "ok"}

  /metrics:
    get:
      tags: [saúde]
      summary: Métricas no formato do Prometheus
      description: >
        Contagem de requisições e latência por rota (`url_rule`), método e status, em
        `flask_http_request_duration_seconds` (histograma). O `/health` não entra na contagem.
      responses:
        "200":
          description: Texto no formato de exposição do Prometheus.
          content:
            text/plain:
              schema:
                type: string
